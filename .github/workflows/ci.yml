name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: Test
        run: go test ./...

      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build -Force | Out-Null
          go build -ldflags="-s -w" -o build/game-patcher-cli-win64.exe ./cmd/cli/
          go build -ldflags="-s -w" -o build/game-patcher-upgrader-win64.exe ./cmd/upgrader/
          go build -ldflags="-s -w" -o build/restorer-win64.exe ./cmd/restorer/

      - name: Upload snapshot binaries
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: game-patcher-${{ github.sha }}
          path: build/*.exe
          if-no-files-found: error
          retention-days: 7
