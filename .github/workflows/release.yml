name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: Test
        run: go test ./...

      - name: Build release binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build -Force | Out-Null
          go build -ldflags="-s -w" -o build/game-patcher-cli-win64.exe ./cmd/cli/
          go build -ldflags="-s -w" -o build/game-patcher-upgrader-win64.exe ./cmd/upgrader/
          go build -ldflags="-s -w" -o build/restorer-win64.exe ./cmd/restorer/

          Get-ChildItem build/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii build/SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(
            "build/game-patcher-cli-win64.exe"
            "build/game-patcher-upgrader-win64.exe"
            "build/restorer-win64.exe"
            "build/SHA256SUMS.txt"
          )
          gh release create "${{ github.ref_name }}" $files `
            --repo "${{ github.repository }}" `
            --verify-tag `
            --generate-notes `
            --title "${{ github.ref_name }}"
